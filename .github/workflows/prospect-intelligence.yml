name: Prospect Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8-15 * * 2-6'
      timezone: 'Europe/London'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prospect-intelligence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install parser dependencies
        run: pip install -r requirements.txt

      - name: Reconstruct app folders
        shell: bash
        run: |
          mkdir -p scripts data
          cp refresh_companies_house.py scripts/refresh_companies_house.py
          cp feed_status.js data/feed_status.js
          cp feed_status.json data/feed_status.json
          cp processed_feeds.json data/processed_feeds.json
          cp prospects.js data/prospects.js
          cp prospects.json data/prospects.json

      - name: Refresh and enrich Companies House prospect feed
        run: python scripts/refresh_companies_house.py

      - name: Persist refreshed feed state
        shell: bash
        run: |
          cp data/feed_status.js feed_status.js
          cp data/feed_status.json feed_status.json
          cp data/processed_feeds.json processed_feeds.json
          cp data/prospects.js prospects.js
          cp data/prospects.json prospects.json

          if git diff --quiet -- feed_status.js feed_status.json processed_feeds.json prospects.js prospects.json; then
            echo "No Companies House data changes to commit."
          else
            git config user.name "Oldfield Prospect Intelligence"
            git config user.email "prospect-intelligence@users.noreply.github.com"
            git add feed_status.js feed_status.json processed_feeds.json prospects.js prospects.json
            git commit -m "Refresh Companies House prospect feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp config.js _site/config.js
          cp data/prospects.js _site/data/prospects.js
          cp data/feed_status.js _site/data/feed_status.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Prospect Intelligence
        id: deployment
        uses: actions/deploy-pages@v4

