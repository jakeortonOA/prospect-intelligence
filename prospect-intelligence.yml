name: Prospect Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Companies House normally publishes the daily accounts file Tue-Sat.
    # Check repeatedly so a late publication is picked up without human intervention.
    - cron: '17 8-15 * * 2-6'
      timezone: 'Europe/London'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prospect-intelligence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install parser dependencies
        run: pip install -r requirements.txt

      - name: Check Companies House for any newer daily ZIP
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/refresh_companies_house.py

      - name: Persist refreshed feed state
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No newer Companies House daily file was available."
          else
            git config user.name "Oldfield Prospect Intelligence"
            git config user.email "prospect-intelligence@users.noreply.github.com"
            git add data/
            git commit -m "Refresh Companies House prospect feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp config.js _site/config.js
          cp data/prospects.js _site/data/prospects.js
          cp data/feed_status.js _site/data/feed_status.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Prospect Intelligence
        id: deployment
        uses: actions/deploy-pages@v4
